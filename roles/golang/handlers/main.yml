---
# handlers file for golang
- name: Change GOPATH
  ansible.builtin.command:
    cmd: go env -w GOPATH=$HOME/.go
  changed_when: true

- name: Setup PATH
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.bashrc"
    regexp: '^export PATH="$HOME/.go'
    line: 'export PATH="$HOME/.go:$PATH"'
