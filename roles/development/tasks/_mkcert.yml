---
- name: Install certutil for Debian based OS
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    name: libnss3-tools

- name: Install certutil for RedHat based OS
  become: true
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name: nss-tools
